<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — ALYA & CO.</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #FAF6F1;
      --warm:  #F2E8DD;
      --sand:  #EAD1BF;
      --gold:  #B8975A;
      --dark:  #1C1612;
      --mid:   #6B5B4E;
      --light: #A8958A;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      background: var(--cream);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
      overflow: hidden;
    }

    /* ── FOND DÉCORATIF ─────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(184,151,90,.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(234,209,191,.4) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── NUMÉRO ─────────────────────────────────────────────────── */
    .number {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(120px, 22vw, 220px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.03em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--sand);
      position: relative;
      animation: fadeUp .8s cubic-bezier(.4,0,.2,1) both;
      user-select: none;
    }

    .number span {
      color: var(--gold);
      -webkit-text-stroke: 0;
    }

    /* ── SÉPARATEUR ─────────────────────────────────────────────── */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 28px auto;
      animation: fadeUp .8s .1s cubic-bezier(.4,0,.2,1) both;
    }

    /* ── TEXTE ──────────────────────────────────────────────────── */
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--dark);
      margin-bottom: 16px;
      animation: fadeUp .8s .15s cubic-bezier(.4,0,.2,1) both;
    }

    p {
      font-size: 15px;
      color: var(--mid);
      line-height: 1.75;
      max-width: 380px;
      margin: 0 auto 40px;
      animation: fadeUp .8s .2s cubic-bezier(.4,0,.2,1) both;
    }

    /* ── BOUTONS ────────────────────────────────────────────────── */
    .actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp .8s .28s cubic-bezier(.4,0,.2,1) both;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
    }
    .btn:hover { opacity: .82; transform: translateY(-1px); }

    .btn-dark {
      background: var(--dark);
      color: var(--cream);
    }

    .btn-outline {
      background: transparent;
      color: var(--dark);
      border: 1px solid var(--sand);
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

    /* ── LIENS RAPIDES ──────────────────────────────────────────── */
    .quick-links {
      margin-top: 56px;
      animation: fadeUp .8s .35s cubic-bezier(.4,0,.2,1) both;
    }
    .quick-links p {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--light);
      margin-bottom: 16px;
    }
    .quick-links a {
      display: inline-block;
      margin: 4px 10px;
      font-size: 13px;
      color: var(--mid);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .quick-links a:hover { color: var(--gold); border-color: var(--gold); }

    /* ── LOGO ───────────────────────────────────────────────────── */
    .logo {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      letter-spacing: .18em;
      color: var(--dark);
      text-decoration: none;
      white-space: nowrap;
    }
    .logo span { color: var(--gold); }

    /* ── ANIMATION ──────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .actions { flex-direction: column; align-items: center; }
      .btn { width: 240px; text-align: center; }
    }
  </style>
</head>
<body>

  <a href="/" class="logo">ALYA <span>&</span> CO.</a>

  <div class="number">4<span>0</span>4</div>

  <div class="divider"></div>

  <h1>Cette page est introuvable</h1>
  <p>La page que vous cherchez a peut-être été déplacée ou n'existe plus. Pas de panique — notre boutique est toujours là pour vous.</p>

  <div class="actions">
    <a href="/" class="btn btn-dark">Retour à l'accueil</a>
    <a href="/collection-siwak" class="btn btn-outline">Voir nos produits</a>
  </div>

  <div class="quick-links">
    <p>Raccourcis</p>
    <a href="/collection-siwak">Collection Siwak</a>
    <a href="/collection-gants">Gants exfoliants</a>
    <a href="/nos-packs">Nos packs</a>
    <a href="/faq">FAQ</a>
    <a href="/contact">Contact</a>
  </div>

<script src="/js/i18n.js"></script>
</body>
</html>
